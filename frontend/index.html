<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danish — Digital Twin</title>
    <meta name="description" content="Have a real-time voice conversation with Danish's AI digital twin.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c6aef'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #07080c;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.07);
            --accent: #7c6aef;
            --accent-glow: rgba(124, 106, 239, 0.35);
            --accent-bg: rgba(124, 106, 239, 0.08);
            --accent-border: rgba(124, 106, 239, 0.2);
            --teal: #4ecdc4;
            --teal-glow: rgba(78, 205, 196, 0.35);
            --teal-bg: rgba(78, 205, 196, 0.08);
            --teal-border: rgba(78, 205, 196, 0.2);
            --text: #f3f4f8;
            --text-secondary: #8c8ea0;
            --text-muted: #4e5166;
            --danger: #ef4444;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            max-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 50% 5%, rgba(124, 106, 239, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 45% 40% at 80% 95%, rgba(78, 205, 196, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100dvh;
            padding: 1.5rem 1.25rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 0.85rem;
            box-sizing: border-box;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            flex-shrink: 0;
        }

        .header-badge {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-bg);
            border: 1px solid var(--accent-border);
            padding: 0.2rem 0.7rem;
            border-radius: 100px;
            margin-bottom: 0.15rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .header-badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            background: linear-gradient(180deg, #ffffff 30%, #b8bad2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 300;
            max-width: 300px;
            line-height: 1.35;
        }

        /* ── Orb Visualizer ── */
        .orb-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin: 0;
        }

        .orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #9e91f8, #6353c7, #362688);
            box-shadow: 0 0 45px var(--accent-glow), inset 0 -6px 18px rgba(0,0,0,0.35);
            position: relative;
            z-index: 2;
            transition: background 0.6s ease, box-shadow 0.6s ease, transform 0.4s ease;
        }

        .orb::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 25%;
            width: 22%;
            height: 22%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            filter: blur(5px);
        }

        .orb.idle { animation: idlePulse 4.5s ease-in-out infinite; }

        .orb.speaking {
            animation: speakPulse 1.1s ease-in-out infinite;
            box-shadow: 0 0 65px rgba(124, 106, 239, 0.5), 0 0 110px rgba(124, 106, 239, 0.2),
                        inset 0 -6px 18px rgba(0,0,0,0.35);
        }

        .orb.listening {
            background: radial-gradient(circle at 30% 30%, #72e9e1, #33b8b0, #1c7a74);
            box-shadow: 0 0 45px var(--teal-glow), inset 0 -6px 18px rgba(0,0,0,0.35);
            animation: listenPulse 1.8s ease-in-out infinite;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(124, 106, 239, 0.14);
            width: 100px;
            height: 100px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
        }

        .orb-wrapper.active .ring { animation: ringExpand 3s ease-out infinite; }
        .orb-wrapper.active .ring:nth-child(3) { animation-delay: 0.6s; }
        .orb-wrapper.active .ring:nth-child(4) { animation-delay: 1.2s; }
        .orb-wrapper.active .ring:nth-child(5) { animation-delay: 1.8s; }

        @keyframes idlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes speakPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        @keyframes listenPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes ringExpand {
            0%   { width: 100px; height: 100px; opacity: 0.4; }
            100% { width: 220px; height: 220px; opacity: 0; }
        }

        /* ── Status Pill ── */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-shrink: 0;
        }

        .status-pill.connected {
            color: var(--teal);
            border-color: var(--teal-border);
            background: var(--teal-bg);
        }

        .status-pill.error {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.25);
            background: rgba(239, 68, 68, 0.08);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 6px currentColor;
        }

        .timer {
            font-variant-numeric: tabular-nums;
            opacity: 0.8;
            font-weight: 500;
        }

        /* ── Open Conversation Feed (Internal scroll, Top Fade Mask) ── */
        .conversation-feed {
            width: 100%;
            flex: 1 1 auto;
            min-height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.5rem 0.25rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 10%, black 20%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 10%, black 20%, black 100%);
        }

        .conversation-feed::-webkit-scrollbar {
            width: 4px;
        }
        .conversation-feed::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .feed-placeholder {
            color: var(--text-muted);
            font-size: 0.82rem;
            text-align: center;
            margin: auto;
            user-select: none;
            letter-spacing: 0.02em;
        }

        /* ── Clean Message Bubbles ── */
        .msg {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-width: 90%;
            animation: msgFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .msg-agent {
            align-self: flex-start;
        }

        .msg-user {
            align-self: flex-end;
        }

        .msg-header {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .msg-agent .msg-header { color: var(--accent); }
        .msg-user  .msg-header { color: var(--teal); justify-content: flex-end; }

        .msg-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: currentColor;
        }

        .msg-bubble {
            padding: 0.7rem 0.95rem;
            font-size: 0.86rem;
            line-height: 1.5;
            color: var(--text);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .msg-agent .msg-bubble {
            background: var(--accent-bg);
            border: 1px solid var(--accent-border);
            border-radius: 14px 14px 14px 4px;
        }

        .msg-user .msg-bubble {
            background: var(--teal-bg);
            border: 1px solid var(--teal-border);
            border-radius: 14px 14px 4px 14px;
        }

        .msg-text.interim {
            color: var(--text-secondary);
            font-style: italic;
        }

        @keyframes msgFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Primary Action Button ── */
        .btn-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn {
            padding: 0.8rem 2.2rem;
            border-radius: 100px;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 200px;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-start {
            background: linear-gradient(135deg, #8774ff 0%, #6854e6 100%);
            color: #fff;
            box-shadow: 0 4px 24px var(--accent-glow);
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 32px rgba(124, 106, 239, 0.45);
        }

        .btn-stop {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-stop:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ── Footer ── */
        .footer {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .container { padding: 1.25rem 1rem 0.75rem; gap: 0.65rem; }
            .orb-wrapper { width: 120px; height: 120px; }
            .orb { width: 85px; height: 85px; }
            .header h1 { font-size: 1.4rem; }
            @keyframes ringExpand {
                0%   { width: 85px; height: 85px; opacity: 0.4; }
                100% { width: 180px; height: 180px; opacity: 0; }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-badge">
                <span class="header-badge-dot"></span>
                <span>Voice AI Twin</span>
            </div>
            <h1>Danish</h1>
            <p>AI Engineer &mdash; ask me anything in real-time</p>
        </div>

        <div class="orb-wrapper" id="orbWrapper">
            <div class="orb idle" id="orb"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <div class="status-pill" id="statusRow">
            <span class="status-dot"></span>
            <span id="status">Click below to start a conversation</span>
            <span class="timer" id="timer"></span>
        </div>

        <div class="conversation-feed" id="transcript">
            <span class="feed-placeholder" id="placeholder">Conversation will appear here&hellip;</span>
        </div>

        <div class="btn-wrapper">
            <button class="btn btn-start" id="actionBtn">Start Conversation</button>
        </div>

        <div class="footer">Digital Twin Experience</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script>
        /* ── LiveKit SDK references ── */
        const { Room, RoomEvent, Track } = LivekitClient;

        /* ── State ── */
        let room = null;
        let connected = false;
        let timerHandle = null;
        let startTime = null;
        let inactivityHandle = null;
        let warningHandle = null;
        const INACTIVITY_WARNING = 30_000;  // warn at 30s
        const INACTIVITY_TIMEOUT = 45_000;  // disconnect at 45s
        
        // Map segId -> { el, textEl, speaker, final } to strictly isolate each transcript segment
        const segmentMap = new Map();
        
        let agentJoined = false;
        let idleDebounce = null;
        let agentJoinTimeout = null;
        const IDLE_DEBOUNCE_MS = 1500; // wait before showing idle after speech stops
        const AGENT_JOIN_TIMEOUT_MS = 10000;

        /* ── DOM ── */
        const orbEl       = document.getElementById('orb');
        const orbWrapper  = document.getElementById('orbWrapper');
        const statusRow   = document.getElementById('statusRow');
        const statusEl    = document.getElementById('status');
        const timerEl     = document.getElementById('timer');
        const transcriptEl= document.getElementById('transcript');
        const placeholder = document.getElementById('placeholder');
        const actionBtn   = document.getElementById('actionBtn');

        actionBtn.addEventListener('click', handleAction);

        /* ── Helpers ── */
        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusRow.className = 'status-pill' + (cls ? ` ${cls}` : '');
        }

        function setOrb(state) {
            orbEl.className = 'orb ' + state;
            orbWrapper.classList.toggle('active', state === 'speaking');
        }

        function startTimer() {
            startTime = Date.now();
            timerHandle = setInterval(() => {
                const s = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(s / 60);
                timerEl.textContent = `${m}:${String(s % 60).padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerHandle);
            timerEl.textContent = '';
        }

        function resetInactivity() {
            clearTimeout(inactivityHandle);
            clearTimeout(warningHandle);
            if (connected) {
                warningHandle = setTimeout(() => {
                    setStatus('Still there? Disconnecting soon\u2026', 'error');
                }, INACTIVITY_WARNING);
                inactivityHandle = setTimeout(() => {
                    setStatus('Disconnected \u2014 no activity', '');
                    disconnect();
                }, INACTIVITY_TIMEOUT);
            }
        }

        function clearAgentJoinTimeout() {
            clearTimeout(agentJoinTimeout);
            agentJoinTimeout = null;
        }

        function handleTranscriptionSegments(segs, participant) {
            if (!segs || segs.length === 0) return;

            if (placeholder && placeholder.parentElement) {
                placeholder.remove();
            }

            for (const seg of segs) {
                const isAgent = !participant || participant.identity !== room?.localParticipant?.identity;
                const speaker = isAgent ? 'Danish' : 'You';
                const text = (seg.text || '').trim();
                if (!text) continue;

                if (segmentMap.has(seg.id)) {
                    // Update existing segment bubble in-place
                    const item = segmentMap.get(seg.id);
                    item.textEl.textContent = text;
                    item.textEl.classList.toggle('interim', !seg.final);
                    item.final = !!seg.final;
                } else {
                    // Create new distinct message bubble for this segment ID
                    const el = document.createElement('div');
                    el.className = `msg ${isAgent ? 'msg-agent' : 'msg-user'}`;
                    el.innerHTML =
                        `<div class="msg-header"><span class="msg-dot"></span><span>${speaker}</span></div>` +
                        `<div class="msg-bubble"><span class="msg-text ${seg.final ? '' : 'interim'}"></span></div>`;
                    
                    const textEl = el.querySelector('.msg-text');
                    textEl.textContent = text;
                    transcriptEl.appendChild(el);

                    segmentMap.set(seg.id, {
                        el: el,
                        textEl: textEl,
                        speaker: speaker,
                        final: !!seg.final
                    });
                }
            }

            transcriptEl.scrollTo({ top: transcriptEl.scrollHeight, behavior: 'smooth' });
        }

        /* ── Connect / Disconnect ── */
        async function connect() {
            actionBtn.disabled = true;
            setStatus('Connecting\u2026');
            setOrb('idle');

            try {
                const apiBase = window.TOKEN_API_URL || window.VITE_API_URL || (window.location.hostname === 'localhost' ? 'http://localhost:8080' : '');
                const tokenEndpoint = apiBase ? `${apiBase.replace(/\/$/, '')}/api/token` : '/api/token';
                const res = await fetch(tokenEndpoint, { method: 'POST' });
                if (!res.ok) throw new Error(`Server error ${res.status}`);
                const { token, url } = await res.json();

                room = new Room({
                    audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true, echoCancellation: true },
                });

                /* Subscribe to agent audio */
                room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    if (track.kind === Track.Kind.Audio) {
                        const el = track.attach();
                        el.id = 'agent-audio';
                        el.style.display = 'none';
                        el.autoplay = true;
                        el.playsInline = true;
                        document.body.appendChild(el);
                        el.play().catch((err) => {
                            console.error('Agent audio playback failed', err);
                            setStatus('Connected, but audio playback was blocked', 'error');
                        });
                    }
                });

                room.on(RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });

                /* Detect when agent joins the room */
                room.on(RoomEvent.ParticipantConnected, (participant) => {
                    if (participant.identity !== room.localParticipant.identity) {
                        agentJoined = true;
                        clearAgentJoinTimeout();
                        setStatus('Connected \u2014 say something', 'connected');
                    }
                });

                /* Visual feedback for speaking / listening */
                room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
                    if (!connected) return;
                    const agentSpeaking = speakers.some(p => p.identity !== room.localParticipant.identity);
                    const userSpeaking  = speakers.some(p => p.identity === room.localParticipant.identity);
                    if (agentSpeaking || userSpeaking) {
                        resetInactivity();
                        clearTimeout(idleDebounce);
                        idleDebounce = null;
                    }
                    if (agentSpeaking) {
                        setOrb('speaking');
                        setStatus('Danish is speaking\u2026', 'connected');
                    } else if (userSpeaking) {
                        setOrb('listening');
                        setStatus('Listening\u2026', 'connected');
                    } else if (!idleDebounce) {
                        idleDebounce = setTimeout(() => {
                            idleDebounce = null;
                            if (connected) {
                                setOrb('idle');
                                setStatus('Connected \u2014 say something', 'connected');
                            }
                        }, IDLE_DEBOUNCE_MS);
                    }
                });

                /* Live transcriptions with unique segment ID isolation */
                room.on(RoomEvent.TranscriptionReceived, (segs, participant) => {
                    handleTranscriptionSegments(segs, participant);
                });

                room.on(RoomEvent.Disconnected, () => onDisconnected());

                await room.connect(url, token);
                await room.localParticipant.setMicrophoneEnabled(true);

                connected = true;
                agentJoined = room.remoteParticipants.size > 0;
                if (agentJoined) {
                    clearAgentJoinTimeout();
                } else {
                    agentJoinTimeout = setTimeout(() => {
                        if (!connected || agentJoined) return;
                        setStatus('Agent did not join. Check backend dispatch or API keys.', 'error');
                    }, AGENT_JOIN_TIMEOUT_MS);
                }
                setStatus(agentJoined ? 'Connected \u2014 say something' : 'Waiting for Danish\u2026', 'connected');
                setOrb('idle');
                startTimer();
                resetInactivity();

                actionBtn.disabled = false;
                actionBtn.className = 'btn btn-stop';
                actionBtn.textContent = 'End Conversation';

            } catch (err) {
                console.error(err);
                const msg = err.name === 'NotAllowedError'
                    ? 'Microphone access denied \u2014 please allow and retry'
                    : 'Connection failed \u2014 please try again';
                setStatus(msg, 'error');
                setOrb('idle');
                actionBtn.disabled = false;
            }
        }

        async function disconnect() {
            if (room) await room.disconnect();
            onDisconnected();
        }

        function onDisconnected() {
            connected = false;
            room = null;
            stopTimer();
            clearTimeout(inactivityHandle);
            clearTimeout(warningHandle);
            clearTimeout(idleDebounce);
            clearAgentJoinTimeout();
            idleDebounce = null;
            setOrb('idle');
            setStatus('Conversation ended');
            actionBtn.className = 'btn btn-start';
            actionBtn.textContent = 'Start New Conversation';
            actionBtn.disabled = false;

            const audio = document.getElementById('agent-audio');
            if (audio) audio.remove();
        }

        function handleAction() {
            if (connected) {
                disconnect();
            } else {
                transcriptEl.innerHTML = '<span class="feed-placeholder" id="placeholder">Conversation will appear here&hellip;</span>';
                segmentMap.clear();
                agentJoined = false;
                connect();
            }
        }
    </script>
</body>
</html>
