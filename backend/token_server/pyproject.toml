[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-token-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "pyjwt>=2.8.0",
    "httpx2>=0.25.0"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
